overview: |
  Rooms are called **segments** in the protocol. Segment ids come from the map file (see [maps](../maps/index.md)) and from
  [`get_room_mapping`](#get_room_mapping). Newer bundles keep all map-object edits (carpet areas, door sills, furniture,
  floor material, cliff, stuck points) as separate calls that carry the map id (`map_index` / `map_flag`) of the map being
  edited (`replaceId` in the plugin code).

commands:
  - method: get_room_mapping
    title: Room number to room name mapping
    summary: Returns, per room, the segment number and the room id of the cloud/IoT room it is assigned to.
    request: '`params`: none (`[]`); a01 passes `{}`.'
    response: |
      `result` is an array of arrays. The first element of each is the segment number; the second is the id the plugin
      uses as `iotRoomId` (Roborock app) or `miRoomId` (Mi Home) when naming rooms; newer firmware appends further columns
      (the plugin indexes `roomMapping[i][1]` and `[i][2]` as the tag id, ✅ Bundle · a65 m10112).
    examples:
      - label: legacy capture (unverified)
        json: |
          {"result": [[16, "<room id>"], [17, "<room id>"]], "id": 14837}
    legacy: '⚪ Legacy [room_mapping.md](../../room_mapping.md) — consistent; the README lists it as "s5e, m1s".'
    related: [name_segment, app_segment_clean]

  - method: merge_segment
    title: Merge rooms
    summary: Merges the selected rooms into one.
    request: '`params`: the array of selected segment ids (at least 2), `mergeList` of the map editor (a65 m14327).'
    behaviour: 'In the retry list ([transports](../concepts/transports.md#retry-protocol)). After success the app re-downloads the map.'
    related: [split_segment, name_segment]

  - method: split_segment
    title: Split a room
    summary: Splits a room along a line drawn in the editor.
    request: '`params`: the object `splitParams.info` produced by the editor (segment id and the two line end points; the layout is internal to the map editor, ❓ not decoded).'
    behaviour: 'Retry-capable; app re-downloads the map afterwards.'
    related: [merge_segment]

  - method: name_segment
    title: Name rooms
    summary: Writes the room names (via room tags) to the robot.
    request: |
      `params`: an array of objects `{"miRoomId" | "iotRoomId": <id>, "robotRoomId": <segment id>, "robotTagId": <tag id>}`
      (`miRoomId` in Mi Home, `iotRoomId` in the Roborock app; ✅ Bundle · a65 m10112 `addZoneParams`).
    behaviour: 'Retry-capable. The app then calls `get_room_mapping` again to refresh its cache. Room-name tags need new-feature bit `isRoomNameSupported` (low word bit 14).'
    related: [get_room_mapping]

  - method: manual_segment_map
    title: Switch to manual room division
    summary: Turns the automatic room division of a map into a manual (editable) one.
    request: '`params`: `{"map_flag": <map id>}` with multi-floor, otherwise `[]`.'
    related: [merge_segment, split_segment]

  - method: get_segment_status
    title: Segment status (wrapped, unused)
    summary: Wrapped in every bundle; no call site.
    request: '`params`: none (`[]`).'
    related: [get_room_mapping]

  - method: set_scenes_segments
    title: "Smart scene: rooms"
    summary: Registers a smart-scene task for rooms.
    request: '`params`: `[{"tid": <task id>, "segs": [{"sid": <segment id>}, …]}]`; the reply `result[0].tid` is the robot-side task id; the app then adds `fan_power` / `water_box_mode` to each returned segment.'
    behaviour: 'Smart scenes need new-feature bit `isSupportSmartScene` (high word bit 1).'
    related: [set_scenes_zones, get_scenes_valid_tids, reunion_scenes]

  - method: set_scenes_zones
    title: "Smart scene: zones"
    summary: Registers a smart-scene task for rectangular zones.
    request: '`params`: `[{"tid": <task id>, "zones": [{"range": <rect>, "zid": <id>}, …]}]`.'
    response: '`result[0] = {"tid", "zones": [ … ]}`.'
    related: [set_scenes_segments]

  - method: get_scenes_valid_tids
    title: List valid scene task ids
    summary: Returns the task ids the robot knows.
    request: '`params`: none (`{}`).'
    response: '`result` is an array of objects with a `tid` field.'
    related: [reunion_scenes]

  - method: reunion_scenes
    title: Re-sync scene tasks
    summary: Tells the robot which task ids are valid on the cloud side.
    request: '`params`: `[{"tid": <id>}, …]` (the intersection of robot and cloud ids).'
    related: [get_scenes_valid_tids]

  - method: save_furnitures
    title: Save furniture objects
    summary: Writes the edited furniture list of a map.
    request: '`params`: `{"map_flag": <map id>, "data": <furniture array>}`.'
    behaviour: 'Needs new-feature bit `isSupportFurniture` (high word bit 4).'
    related: [set_identify_furniture_status]

  - method: set_identify_furniture_status
    title: Furniture recognition switch
    summary: Turns furniture recognition on or off.
    request: '`params`: `{"status": 0|1}`. The app sets floor-material recognition first and furniture recognition second.'
    related: [get_identify_furniture_status, set_identify_ground_material_status]

  - method: get_identify_furniture_status
    title: Furniture recognition switch (read)
    summary: Reads the switch.
    request: '`params`: none (`[]`).'
    response: '`result.status == 1` means on (an object, not an array).'
    related: [set_identify_furniture_status]

  - method: set_segment_ground_material
    title: Set room floor material
    summary: Stores the floor type per room.
    request: '`params`: `{"data": <array of per-room floor entries>}`.'
    related: [set_identify_ground_material_status]

  - method: set_identify_ground_material_status
    title: Floor-material recognition switch
    summary: Turns floor-material recognition on or off.
    request: '`params`: `{"status": 0|1}`.'
    related: [get_identify_ground_material_status]

  - method: get_identify_ground_material_status
    title: Floor-material recognition switch (read)
    summary: Reads the switch.
    request: '`params`: none (`[]`).'
    response: '`result.status == 1` means on.'
    related: [set_identify_ground_material_status]

  - method: set_ignore_identify_area
    title: Ignore recognised objects
    summary: Marks recognised obstacles as ignored.
    request: '`params`: an array of at most 49 entries `[2, <a>, <b>, <c>]` taken from the ignored-obstacle triplets of the map objects (a65 m14231).'
    related: [get_photo]

  - method: set_carpet_area
    title: Add carpet areas
    summary: Saves user-added carpet zones.
    request: '`params`: `{"map_index": <map id>, "type": <int>, "zone_data": <zones>}`.'
    behaviour: 'Needs new-feature bit `isMapCarpetAddSupport` (low word bit 30).'
    related: [set_ignore_carpet_zone]

  - method: set_ignore_carpet_zone
    title: Carpet-ignore zones
    summary: Saves zones where carpet detection is ignored.
    request: '`params`: `{"map_index": <map id>, "zone_data": <zones>}`.'
    related: [set_carpet_area, set_carpet_mode]

  - method: app_set_door_sill_blocks
    title: Door-sill blocks
    summary: Saves manual door-sill (threshold) blocks.
    request: '`params`: `{"map_index": <map id>, "zone_data": <blocks>}`.'
    related: [app_set_smart_door_sill]

  - method: app_set_smart_door_sill
    title: Smart door sills
    summary: Saves the automatic door-sill areas.
    request: '`params`: `{"map_index": <map id>, "zones": <zones>}`.'
    related: [app_set_door_sill_blocks]

  - method: app_set_ignore_stuck_point
    title: Ignore stuck points
    summary: Saves points where the robot's stuck detection is ignored.
    request: '`params`: `{"map_index": <map id>, "point_data": <points>}`.'
    related: [app_set_smart_cliff_forbidden]

  - method: app_set_smart_cliff_forbidden
    title: Cliff-forbidden areas
    summary: Saves areas treated as cliff-forbidden.
    request: '`params`: `{"map_index": <map id>, "zones": <zones>}`.'
    related: [app_set_ignore_stuck_point]
